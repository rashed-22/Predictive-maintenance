[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Machine failure prediction on the AI4I 2020 dataset"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, N naming, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports follow sys.path setup, long display lines, zip() over axes.
"notebooks/*.ipynb" = ["E402", "E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
